<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyroscope Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        .data-box { font-size: 1.5rem; margin: 20px; font-weight: bold; }
        button { padding: 15px 30px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Gyroscope Data</h1>
    <button id="request-btn">Enable Gyroscope</button>
    
    <div class="data-box">Alpha (Z): <span id="alpha">0</span>°</div>
    <div class="data-box">Beta (X): <span id="beta">0</span>°</div>
    <div class="data-box">Gamma (Y): <span id="gamma">0</span>°</div>

    <script>
        const requestBtn = document.getElementById('request-btn');

        // Function to start listening to orientation
        function startGyro() {
            window.addEventListener('deviceorientation', (event) => {
                // Rounding the numbers for clean display
                document.getElementById('alpha').textContent = Math.round(event.alpha);
                document.getElementById('beta').textContent = Math.round(event.beta);
                document.getElementById('gamma').textContent = Math.round(event.gamma);
            });
            requestBtn.style.display = 'none'; // Hide button once active
        }

        // Handle permission requirements (especially for iOS)
        requestBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ devices
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            startGyro();
                        } else {
                            alert('Permission denied');
                        }
                    })
                    .catch(console.error);
            } else {
                // Android and older browsers
                startGyro();
            }
        });
    </script>
</body>
</html>
